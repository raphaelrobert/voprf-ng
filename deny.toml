# Configuration for cargo-deny (https://embarkstudios.github.io/cargo-deny/).
# Run with `cargo deny check`.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# All dependencies use permissive licenses.
allow = ["Apache-2.0", "BSD-1-Clause", "BSD-3-Clause", "MIT", "Unicode-3.0"]

[bans]
# Two `syn` versions (2 + 3) are expected because `curve25519-dalek-derive`
# still depends on `syn` 2.
multiple-versions = "warn"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
